# 必須演習: pytestと既存Semgrepルール。SHA固定は補足で扱う。
name: Lesson checks

on:
  pull_request:
  push:
    branches: [main, lesson, '*/lesson']

permissions:
  contents: read

jobs:
  app-checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [pytest, semgrep]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install lesson dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r pylock.toml
          python -m pip check
      - name: Check search behavior
        if: matrix.check == 'pytest'
        run: python -m pytest -q
      - name: Report all OWASP findings
        if: matrix.check == 'semgrep'
        run: semgrep scan --config p/owasp-top-ten --strict --metrics=off app/
      - name: Require SQL injection check to pass
        if: matrix.check == 'semgrep'
        run: semgrep scan --config r/python.flask.security.injection.tainted-sql-string.tainted-sql-string --error --strict --metrics=off app/
